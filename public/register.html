<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FindFreeJuegos · Registro</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container navbar__inner">
      <a class="brand" href="/">
        <svg class="brand__logo icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="6" x2="10" y1="11" y2="11" />
          <line x1="8" x2="8" y1="9" y2="13" />
          <line x1="15" x2="15.01" y1="12" y2="12" />
          <line x1="18" x2="18.01" y1="10" y2="10" />
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" />
        </svg>
        <span class="brand__name">FindFreeJuegos</span>
      </a>
      <nav class="nav">
        <a class="nav__link" href="/">Inicio</a>
        <a class="nav__link is-active" href="/registro">Registro</a>
      </nav>
    </div>
  </header>

  <main class="container section section--narrow">
    <div class="panel">
      <h1 class="panel__title">Crea tu cuenta</h1>
      <p class="muted" style="margin-top: 0;">Únete a FindFreeJuegos. Todos los campos son obligatorios.</p>

      <div class="status" id="formStatus" hidden></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Pérez" />
          <small class="field__error" data-error-for="nombre"></small>
        </div>

        <div class="field">
          <label for="usuario">Nombre de usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="Ej. anaperez_99" />
          <small class="field__error" data-error-for="usuario"></small>
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" />
          <small class="field__error" data-error-for="email"></small>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" />
          <small class="field__error" data-error-for="password"></small>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" />
          <small class="field__error" data-error-for="confirmPassword"></small>
        </div>

        <div class="field">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input type="date" id="fechaNacimiento" name="fechaNacimiento" />
          <small class="field__error" data-error-for="fechaNacimiento"></small>
        </div>

        <div class="field">
          <label class="checkbox" for="terminos">
            <input type="checkbox" id="terminos" name="terminos" />
            <span>Acepto los términos y condiciones y tener al menos 13 años.</span>
          </label>
          <small class="field__error" data-error-for="terminos"></small>
        </div>

        <button class="btn btn--primary btn--block" type="submit">Registrarme</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>FindFreeJuegos · Proyecto demo</p>
    </div>
  </footer>

  <script src="/js/validation.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
